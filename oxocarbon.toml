# Semantic tokens
[semanticTokenColors]
type = { foreground = "#3ddbd9", fontStyle = "italic" }
class = { foreground = "#3ddbd9", fontStyle = "italic" }
interface = { foreground = "#3ddbd9", fontStyle = "italic" }
struct = { foreground = "#3ddbd9", fontStyle = "italic" }
enum = { foreground = "#3ddbd9", fontStyle = "italic" }
typeParameter = { foreground = "#3ddbd9", fontStyle = "italic" }
namespace = { foreground = "#3ddbd9", fontStyle = "italic" }
function = { foreground = "#ff7eb6" }
method = { foreground = "#ff7eb6" }
macro = { foreground = "#ff7eb6" }
decorator = { foreground = "#ff7eb6" }
string = { foreground = "#be95ff" }
number = { foreground = "#82cfff" }
regexp = { foreground = "#be95ff" }
keyword = { foreground = "#78a9ff" }
operator = { foreground = "#3ddbd9" }
variable = { foreground = "#ffffff" }
parameter = { foreground = "#ffffff", fontStyle = "italic" }
property = { foreground = "#08bdba" }
enumMember = { foreground = "#82cfff" }
event = { foreground = "#08bdba" }
modifier = { foreground = "#33b1ff" }
label = { foreground = "#ffffff" }
"*.deprecated" = { fontStyle = "strikethrough" }
"*.unnecessary" = { foreground = "#6f6f6f" }

[[tokenColors]]
scope = ["comment"]
settings = { foreground = "#6f6f6f" }

[[tokenColors]]
scope = ["entity"]
settings = { foreground = "#dde1e6" }

[[tokenColors]]
scope = ["storage.modifier.package", "storage.modifier.import"]
settings = { foreground = "#f2f4f8" }

[[tokenColors]]
scope = ["variable"]
settings = { foreground = "#ffffff" }

[[tokenColors]]
scope = ["support"]
settings = { foreground = "#08bdba" }

[[tokenColors]]
scope = [
    "storage.type",
    "keyword.other.fn",
    "keyword.operator",
    "punctuation.separator",
    "punctuation.definition.tag",
    "punctuation.definition.list",
    "variable.other.constant.singlequote",
    "variable.other.constant.backquote",
    "variable.other.constant.sharpsign",
]
settings = { foreground = "#3ddbd9" }

[[tokenColors]]
scope = ["keyword"]
settings = { foreground = "#78a9ff" }

[[tokenColors]]
scope = ["storage.modifier", "keyword.other"]
settings = { foreground = "#33b1ff" }

[[tokenColors]]
scope = [
    "entity.name.command",
    "entity.name.function",
    "support.function",
    "storage.type.function.m.nosideeffects"
]
settings = { foreground = "#ff7eb6" }

[[tokenColors]]
scope = ["string", "punctuation.definition.string"]
settings = { foreground = "#be95ff" }

[[tokenColors]]
scope = ["constant"]
settings = { foreground = "#82cfff" }

# styles

[[tokenColors]]
scope = [
    "entity.name.type",
    "entity.name.class",
    "entity.name.struct",
    "entity.name.enum",
    "entity.name.interface",
    "entity.name.namespace",
    "entity.name.scope-resolution",
]
settings = { foreground = "#3ddbd9", fontStyle = "italic" }

[[tokenColors]]
scope = ["entity.name.tag", "support.class.component"]
settings = { foreground = "#ff7eb6", fontStyle = "bold" }

[[tokenColors]]
scope = ["entity.name.tag.yaml"]
settings = { foreground = "#f2f4f8" }

[[tokenColors]]
scope = ["entity.name.variable"]
settings = { foreground = "#ffffff" }

[[tokenColors]]
scope = ["entity.name.decorator"]
settings = { foreground = "#ff7eb6" }

[[tokenColors]]
scope = ["entity.name.function", "variable.other.definition"]
settings = { fontStyle = "bold" }

[[tokenColors]]
scope = ["storage.type", "variable.parameter"]
settings = { fontStyle = "italic" }

# C
[[tokenColors]]
scope = ["keyword.control.directive", "punctuation.definition.directive"]
settings = { foreground = "#08bdba" }

# Rust
[[tokenColors]]
scope = ["storage.type.rust"]
settings = { foreground = "#78a9ff" }

# Go
[[tokenColors]]
scope = ["entity.name.import.go"]
settings = { foreground = "#be95ff" }

# Lisp
[[tokenColors]]
scope = ["support.function.f.sideeffects"]
settings = { foreground = "#ee5396" }

# Verilog
[[tokenColors]]
scope = ["entity.name.type.module.verilog"]
settings = { foreground = "#ee5396" }

[[tokenColors]]
scope = ["entity.name.tag.module.identifier"]
settings = { foreground = "#08bdba" }

[[tokenColors]]
scope = ["entity.name.tag.module.reference"]
settings = { foreground = "#ff7eb6", fontStyle = "bold" }

# Markdown
[[tokenColors]]
scope = ["entity.name.section.markdown", "markup.inline.raw.string.markdown"]
settings = { foreground = "#ffffff", fontStyle = "bold" }

[[tokenColors]]
scope = ["punctuation.definition.heading.markdown"]
settings = { foreground = "#ff7eb6" }

[[tokenColors]]
scope = [
    "punctuation.definition.raw.markdown",
    "punctuation.definition.markdown"
]
settings = { foreground = "#08bdba" }

# for zed export
[[tokenColors]]
scope = ["title"]
settings = { foreground = "#ffffff" }

[[tokenColors]]
scope = ["label"]
settings = { foreground = "#ffffff" }

[[tokenColors]]
scope = ["entity.other.attribute-name"] # attribute
settings = { foreground = "#f2f4f8" }

[[tokenColors]]
scope = ["markup.bold"]
settings = { foreground = "#ffffff", fontStyle = "bold" }

[[tokenColors]]
scope = ["markup.italic"]
settings = { foreground = "#ffffff", fontStyle = "italic" }

# [[tokenColors]] # text vs URI
# scope = ["markup.underline.link"]
# settings = { foreground = "#be95ff", fontStyle = "underline" }

[[tokenColors]]
scope = ["markup.underline.link"]
settings = { foreground = "#ff7eb6", fontStyle = "underline" }

[[tokenColors]]
scope = ["markup.quote"]
settings = { foreground = "#08bdba", fontStyle = "italic" }

[[tokenColors]]
scope = ["invalid"]
settings = { foreground = "#ee5396" }

[[tokenColors]]
scope = ["markup.inserted"]
settings = { foreground = "#42be65" }

[[tokenColors]]
scope = ["markup.deleted"]
settings = { foreground = "#ee5396" }

[[tokenColors]]
scope = ["markup.changed"]
settings = { foreground = "#33b1ff" }

[[tokenColors]]
scope = [
    "punctuation.section.embedded",
    "punctuation.definition.template-expression",
]
settings = { foreground = "#3ddbd9" }

[[tokenColors]]
scope = ["meta.embedded"]
settings = { foreground = "#f2f4f8" }

[[tokenColors]]
scope = ["constant.language"] # boolean
settings = { foreground = "#82cfff" } # TODO true/false

[[tokenColors]]
scope = ["variable.member"] # property (Zed/Helix)
settings = { foreground = "#08bdba" }

[[tokenColors]]
scope = ["variable.other.property", "variable.other.object.property"]
settings = { foreground = "#08bdba" }

[[tokenColors]]
scope = ["preproc"]
settings = { foreground = "#08bdba" }

[[tokenColors]]
scope = ["punctuation"]
settings = { foreground = "#f2f4f8" }

[[tokenColors]]
scope = ["punctuation.definition.comment"]
settings = { foreground = "#6f6f6f" }
