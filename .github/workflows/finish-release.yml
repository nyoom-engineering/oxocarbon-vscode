name: Finish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: package.json version to publish (must already be on Marketplace if republishing OVSX only)
        required: true
        default: "1.3.1"
      publish_ovsx:
        description: Publish VSIX to Open VSX
        type: boolean
        default: true
      create_github_release:
        description: Create GitHub release + assets if missing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Package VSIX
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          NAME=$(jq -r .name package.json)
          PKG_VER=$(jq -r .version package.json)
          if [ "$PKG_VER" != "$VERSION" ]; then
            echo "package.json version $PKG_VER != requested $VERSION" >&2
            exit 1
          fi
          TARGET="${NAME}-${VERSION}.vsix"
          npx --yes @vscode/vsce package -o "$TARGET"
          echo "vsix=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX
        if: inputs.publish_ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "OVSX_TOKEN secret missing" >&2
            exit 1
          fi
          npx --yes ovsx publish "${{ steps.pkg.outputs.vsix }}" --pat "$OVSX_PAT"

      - name: Build release asset zips
        if: inputs.create_github_release
        shell: bash
        run: |
          set -euo pipefail
          # Themes already in repo; zip what we can without full matrix
          mkdir -p release
          cp "${{ steps.pkg.outputs.vsix }}" release/
          (cd themes && zip -r ../release/themes-${{ inputs.version }}.zip .)
          if [ -d intellij ]; then (cd intellij && zip -r ../release/intellij-${{ inputs.version }}.zip .); fi
          if [ -d textmate ]; then (cd textmate && zip -r ../release/textmate-${{ inputs.version }}.zip .); fi

      - name: Create GitHub release
        if: inputs.create_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Oxocarbon Theme v${{ inputs.version }}
          generate_release_notes: true
          files: release/*
